<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%" fill="none">
  <!-- Merantaw Geometric Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base polygon diamond / modern prism representing craftsmanship & journey (Merantau) -->
    <rect x="0" y="0" width="60" height="60" rx="12" fill="#192C56"/>
    <!-- Overlapping dynamic geometric lines in cream & navy -->
    <path d="M15 45 L30 15 L45 45 Z" stroke="#FAF9F6" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
    <path d="M22 45 L30 28 L38 45" stroke="#486581" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="21" r="3" fill="#E2E8F0"/>
  </g>

  <!-- Typography: MERANTAW -->
  <text x="86" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="#192C56">MERANTAW</text>
  <text x="88" y="64" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="2.5" fill="#627D98">GAME &amp; INTERACTIVE STUDIO</text>
</svg>
